[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "retico-dino"
dynamic = ["version"]
dependencies = [
    "retico-core>=2.0.0",
    "retico-vision",
    "numpy",
    "pillow",
    "torch",
    "torchvision",
]
authors = [
    {name = "Ryan Whetten"},
]
description = "Implementation of Meta's DINO models in Retico."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["real-time", "computer vision", "DINO"]

[project.urls]
Repository = "https://github.com/retico-team/retico-dino"

[tool.setuptools_scm]
version_file = "retico_dino/version.py"
